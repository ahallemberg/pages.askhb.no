name: Update Submodule

# Two repos dispatch here now: obsidian-content when a note changes, and
# askhb-theme when the shared palette changes. Either way this only opens a PR;
# merging it is what bumps the pointer and triggers the Cloudflare Pages build.
on:
  repository_dispatch:
    types: [submodule-updated]

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    # Granted here rather than left to the repository's Actions setting. When
    # that setting is read-only -- GitHub's default, and where both newly wired
    # consumers started -- this job fails at `git push` with a 403 long after the
    # dispatch has already reported success, and nothing in this file hints that
    # a setting elsewhere decides whether it can run. Stating the two scopes the
    # job actually needs also drops every other scope the token would carry.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # The payload picks the submodule, so it reaches a shell. Read it from the
      # environment and match it against the two known paths rather than
      # interpolating it into the script: an allowlisted value is the only thing
      # that gets as far as the git command below.
      - name: Resolve submodule
        id: resolve
        env:
          REQUESTED: ${{ github.event.client_payload.path }}
        run: |
          # obsidian-content's dispatch predates this field and sends no path.
          case "${REQUESTED:-content}" in
            content | theme)
              echo "path=${REQUESTED:-content}" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected submodule path: ${REQUESTED}"
              exit 1
              ;;
          esac

      - name: Update submodule
        run: git submodule update --remote "${{ steps.resolve.outputs.path }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update submodule ${{ github.event.client_payload.submodule }}"
          title: "Auto-update submodule: ${{ github.event.client_payload.submodule }}"
          body: |
            Automated submodule update triggered by changes in ${{ github.event.client_payload.submodule }}

            Latest commit: ${{ github.event.client_payload.ref }}
          # Per submodule, so a content PR and a theme PR cannot collide.
          branch: update-${{ steps.resolve.outputs.path }}-${{ github.run_number }}
